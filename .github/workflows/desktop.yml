# The desktop app: its unit tests, its smoke test, and one package per
# platform.
#
# Path-filtered on purpose. The app is a sub-package with its own dependency
# tree, and a three-platform matrix on every lecture commit would be minutes
# of runner time for a change that cannot reach it. The engine files are in
# the filter as well, because the app runs them: a change to build.js can
# break the smoke test without touching a single file under desktop/.
#
# That makes this list the third hand-written copy of what the app stages,
# after FILES in desktop/scripts/stage-engine.mjs and what build.js reads
# about itself - and it went wrong the same way: cue-cards.mjs was on none of
# the three, so a commit touching only that file ran no desktop job at all,
# which is part of why a packaged app that could not build shipped twice.
# desktop/test/stage-engine.test.mjs now holds this filter against FILES,
# exactly - LICENSE included, which is staged into the app and so is on the
# list. A matrix run on a licence edit is the price of a rule with no
# exceptions, and it is cheap: that file changes about never.
#
# Two names are on it that the app does not stage: pdf-export.mjs and
# chrome-path.mjs. The smoke test ends with desktop/test/parity.mjs, which
# exports the same lecture on the command line and compares, so a change to
# the command line's PDF driver can fail this job, and has to run it.
name: Desktop

on:
  push:
    # Branches only. GitHub does not evaluate `paths` for a tag push, so
    # without this every `v*` tag started this matrix on its own, beside the
    # run release.yml makes of it through workflow_call - the three-platform
    # build twice for one release. A `branches` filter with no `tags` filter
    # leaves tag pushes out.
    branches: ['**']
    paths:
      - 'desktop/**'
      - 'build.js'
      - 'diagram-core.mjs'
      - 'tails.mjs'
      - 'cue-cards.mjs'
      - 'commands.mjs'
      - 'pdf-core.mjs'
      - 'pdf-export.mjs'
      - 'chrome-path.mjs'
      - 'pulse-embed.js'
      - 'editor.mjs'
      - 'editor.css'
      - 'package.json'
      - 'package-lock.json'
      - 'LICENSE'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'build.js'
      - 'diagram-core.mjs'
      - 'tails.mjs'
      - 'cue-cards.mjs'
      - 'commands.mjs'
      - 'pdf-core.mjs'
      - 'pdf-export.mjs'
      - 'chrome-path.mjs'
      - 'pulse-embed.js'
      - 'editor.mjs'
      - 'editor.css'
      - 'package.json'
      - 'package-lock.json'
      - 'LICENSE'
      - '.github/workflows/desktop.yml'
  # Run by hand from the Actions tab, this is also how a package between two
  # releases is made: the run's artefacts are the packages, unsigned.
  workflow_dispatch:
  # release.yml runs this same matrix for a `v*` tag and then attaches the
  # packages to the release beside the engine archives, so the release is
  # built by exactly the jobs that test every push.
  workflow_call:

permissions:
  contents: read

jobs:
  # Runners are pinned, not -latest: these jobs rely on measured image properties (Chrome at /usr/bin/google-chrome, no cwebp or magick, xvfb and poppler from apt), so moving one is a deliberate change that needs a browser.yml run first.
  test:
    name: Tests and smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # The engine's own dependencies, because in development the app runs
      # build.js straight out of the repository root.
      - name: Install the engine
        run: npm ci

      - name: Install the app
        working-directory: desktop
        run: npm ci

      - name: Unit tests
        working-directory: desktop
        run: npm test

      # Electron needs a display even to open a window it never shows, and a
      # headless runner has none. poppler-utils is for the parity step at the
      # end of the smoke test, which reads both drivers' PDFs with pdftotext;
      # its command-line half uses the runner's /usr/bin/google-chrome and the
      # engine's playwright-core from the step above. Under CI a missing one
      # fails the step rather than skipping it.
      - name: Install xvfb and poppler
        run: sudo apt-get update && sudo apt-get install -y xvfb poppler-utils

      - name: Smoke test
        working-directory: desktop
        run: xvfb-run --auto-servernum npm run smoke

  package:
    name: Package (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pinned like every runner here (see the line under jobs:); macos-26 is arm64, which the mac-arm64 asset names in release.yml rely on.
        os: [macos-26, windows-2025-vs2026, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install the engine
        run: npm ci

      - name: Install the app
        working-directory: desktop
        run: npm ci

      # Unsigned on purpose, and explicitly: with no identity configured
      # electron-builder on macOS would still look for one in the runner's
      # keychain, and an empty CSC_LINK from an unset secret is read as a
      # file path rather than as absent (the second run here failed with
      # "desktop not a file" for exactly that reason).
      #
      # The signed and notarised macOS release is built on the maintainer's
      # machine with `npm run dist:signed`, the way the Booklet Tool does it:
      # the Developer ID certificate lives in that keychain and the three
      # notarisation variables (APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD,
      # APPLE_TEAM_ID) in a gitignored desktop/.env. Nothing of that is on
      # GitHub. Windows has no code-signing certificate at all, so its
      # installer is unsigned wherever it is built and SmartScreen warns once.
      # What this job produces is for testing, and it is attached to the run
      # rather than to a release – except when release.yml is the caller,
      # which downloads these artefacts and attaches them to the `v*` release
      # under the names `artifactName` in desktop/package.json gives them (no
      # version in the name, so a link keeps working). release.yml checks for
      # those five names, so a change to `artifactName` or to the targets
      # changes its list in the same commit.
      - name: Package
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist -- --publish never

      - uses: actions/upload-artifact@v7
        with:
          name: psi-slides-builder-${{ matrix.os }}
          if-no-files-found: error
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
