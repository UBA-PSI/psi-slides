# Publishes a GitHub Release when a version tag is pushed.
#
#   git tag -a v1.0.0 -m "psi-slides 1.0.0" && git push origin v1.0.0
#
# The two archives are what the README and the project site tell people to
# download, so their names are load-bearing: the site links
# releases/latest/download/psi-slides.tar.gz, which only resolves while the
# asset is called exactly that. They unpack to a psi-slides/ directory,
# because the instructions say `cd psi-slides` next.
#
# What is in them: the repository tree at the tag (`git archive`, so every
# tracked file) – build.js, diagram-core.mjs, editor.mjs, editor.css, lint.js,
# every lecture source, docs/, the checked-in site fonts, LICENSE, package.json
# and the lockfile – plus the four built HTML views for all four published
# lectures. The built views are the reason to prefer the archive over a clone:
# a reader can open the tutorial straight out of it, before installing
# anything. Building their own still needs `npm install`, because the renderer
# depends on marked, Shiki and KaTeX; the archive does not pretend otherwise.
#
# From 2.0.0 the desktop builder ships on the same tag and the same release,
# at the same version (desktop/package.json follows package.json). Its
# packages come from desktop.yml, called as a reusable workflow, so the
# release is built by exactly the jobs that test every push that touches the
# app. Their names carry no version (`artifactName` in desktop/package.json),
# beside the two archives, whose names do not change.
#
# The order, and what a failure leaves behind. `check` compares the tag with
# both package.json files and cuts the release notes, in seconds. `engine`
# (every check the engine has, then the two archives) and `desktop` (the
# app's tests and smoke test, then one package per platform) both need it
# and run side by side. `publish` needs all three and is the only job that
# writes to the release, so the release is created exactly once, with every
# asset, and nothing races: when any earlier job fails, `publish` does not
# run and there is no release at all – no engine release without its app,
# no app without its engine. The tag stays; "Re-run failed jobs" on the run
# retries a flaky runner and then publishes, or the tag is deleted, the
# cause fixed and the tag pushed again. `gh release create` with assets
# makes a draft, uploads, and only then publishes, so a failed upload leaves
# a draft to delete rather than a half-published release.
#
# What CI cannot do: sign. The macOS package here is unsigned; the signed and
# notarised one is built on the maintainer's machine with `npm run
# dist:signed` and uploaded over this one with `gh release upload <tag>
# <file> --clobber` – same name, so a link does not change. Windows has no
# certificate and warns once; Windows and Linux are built but not yet tried
# on a real machine, and the release notes say so.

name: Release

on:
  push:
    tags: ['v*']

# Read-only by default; `publish` is the one job that writes.
permissions:
  contents: read

jobs:
  check:
    name: Tag, versions and release notes
    runs-on: ubuntu-latest
    outputs:
      have_notes: ${{ steps.notes.outputs.have_notes }}
    steps:
      - uses: actions/checkout@v4

      # A tag that disagrees with package.json ships an archive whose own
      # metadata contradicts the release it came from, and a tag that
      # disagrees with desktop/package.json ships an app whose About line
      # names another version than the release it is attached to. Cheaper to
      # catch here than to explain later.
      - name: Check the tag against both package.json files
        run: |
          tag="${GITHUB_REF_NAME#v}"
          status=0
          for f in package.json desktop/package.json; do
            pkg="$(node -p "require('./$f').version")"
            if [ "$tag" != "$pkg" ]; then
              echo "tag $GITHUB_REF_NAME does not match $f version $pkg" >&2
              status=1
            fi
          done
          exit $status

      # The release body, cut from the changelog section for this version so
      # the release page says what changed without anyone retyping it. GitHub
      # refuses a body over 125,000 characters, and the 2.0.0 section alone is
      # more than twice that, so this runs before anything is built: a body
      # that cannot be published should fail in seconds, not after the
      # browser suite. When the section has a `### Highlights` heading, the
      # body is what stands above the first heading that is neither that nor
      # `### Breaking`, plus a link to CHANGELOG.md at the tag, and the
      # section's own `](#anchor)` links are pointed at that file too. A
      # section without one goes in whole. Either way the paragraph on the
      # desktop packages follows, and the size is checked with it. The size
      # is counted in bytes, which are never fewer than the characters GitHub
      # counts. A missing section falls back to GitHub's generated notes,
      # which `gh` puts after the desktop paragraph, rather than to an empty
      # body.
      - name: Cut the release notes
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > SECTION.md
          full="https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md"
          if [ ! -s SECTION.md ]; then
            echo "have_notes=false" >> "$GITHUB_OUTPUT"
            : > RELEASE_NOTES.md
          elif grep -q '^### Highlights$' SECTION.md; then
            echo "have_notes=true" >> "$GITHUB_OUTPUT"
            awk '/^### / && $0 !~ /^### (Breaking|Highlights)$/ { exit } { print }' SECTION.md \
              | sed "s|](#|](${full}#|g" > RELEASE_NOTES.md
            printf '\nEvery change in this release, with the reasons: [CHANGELOG.md](%s).\n' "$full" >> RELEASE_NOTES.md
          else
            echo "have_notes=true" >> "$GITHUB_OUTPUT"
            cp SECTION.md RELEASE_NOTES.md
          fi
          cat >> RELEASE_NOTES.md <<'MD'

          ### The desktop builder

          The `psi-slides-builder-*` files are the desktop builder at this version: a window that opens a `source.md`, builds it on every save and says whether the last save built. It bundles the engine of this release.

          - **macOS** (`.dmg`, `.zip`, Apple silicon): tried on a real Mac. The package attached by CI is unsigned; the signed and notarised one is uploaded over it by hand, under the same name, and if this note is still here, that has not happened yet – open it once with a right click and *Open*.
          - **Windows** (`.exe`, NSIS installer): **experimental** – built by CI, not yet tried on a Windows machine. Unsigned; SmartScreen shows a blue panel once, *More info* then *Run anyway* installs it.
          - **Linux** (`.AppImage`, `.deb`): **experimental** – built by CI, not yet tried on a Linux machine. The AppImage needs the executable bit (`chmod +x`).

          Nothing leaves the computer: no account, no telemetry, no update check. If one of the experimental packages does not start or does not build, an issue with the platform, the version and what the window said is the most useful thing you can send.
          MD
          size="$(wc -c < RELEASE_NOTES.md | tr -d ' ')"
          echo "release notes: $size bytes"
          if [ "$size" -gt 125000 ]; then
            echo "the release notes are $size bytes and GitHub takes 125,000 characters at most:" >&2
            echo "give the CHANGELOG.md section for $version a '### Highlights' heading after its" >&2
            echo "'### Breaking' list, so the body stops there, or shorten the summary" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          if-no-files-found: error
          path: RELEASE_NOTES.md

  engine:
    name: Engine checks and archives
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git archive needs the tagged tree, not a shallow tip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The same gate the Pages workflow runs. A release that does not lint is
      # not a release.
      - name: Lint
        run: node lint.js lectures/ docs/site/example/source.md docs/artifact/figure-rules/source.md

      # The compiler gates, same as the Pages job. A release that ships a
      # linter which has drifted from the build ships the one failure mode
      # `lint.js` exists to prevent.
      - name: Fast gates
        run: node test/gates/run.mjs

      # A release is exactly where the 1.0 compatibility promise matters, so
      # it is checked before the archive is cut rather than after.
      - name: Layout-generation compatibility
        run: node test/settings.mjs

      - name: Build the lectures
        run: |
          # The three lectures whose views are tracked, with the flags they
          # were committed with: --no-optimize-images, because the inlined
          # WebP is whatever the local cwebp or magick made of a PNG, this
          # runner has neither, and two encoder versions differ in bytes too.
          # The staleness check below compares against this rebuild.
          npm run build:tracked
          node build.js lectures/python-intro/source.md
          node build.js docs/site/example/source.md
          # Linted above and not published, which is exactly why they are built
          # here: the linter is deliberately the laxer of the pair, so a line
          # it passes and the compiler refuses would merge green and fail every
          # later build. These two hold the largest bodies of real figures in
          # the repository and are the likeliest to catch a refusal that is too
          # strict.
          node build.js lectures/network-security/source.md
          node build.js docs/artifact/figure-rules/source.md

      # What the staleness check below rests on: that a rebuild is a function
      # of the source alone. It was not, for a while - the inlined-SVG id
      # counter reset once per build rather than once per view, so the same
      # figure came out psi-fig-6- under --audience-only and psi-fig-8- under
      # a full build, and a view rebuilt with a partial flag read as stale
      # here for a diff of pure id churn. Ordered before the check it
      # protects, so a failure names the cause rather than the symptom.
      - name: Check a view is the same bytes whichever flags wrote it
        run: node test/reproducible.mjs

      # The tutorial and diagram HTML is committed; a stale copy would ship a
      # tour, or a construct reference, that does not match its own source.
      - name: Check the tracked outputs are current
        run: |
          git diff --exit-code -- lectures/tutorial lectures/diagrams lectures/decoration || {
            echo "a tracked view is not what its source builds: run npm run build:tracked and commit the views" >&2
            exit 1
          }

      # Same rule one folder over: both figure pages are tracked HTML whose
      # drawings come from the lecture built above, so a stale one ships a
      # picture its own listing no longer produces.
      - name: Check the figure pages are current
        run: node docs/artifact/refresh-figures.mjs --check

      # The assertions that can only be made against a built, served page:
      # the navigation model, the editor's gestures, and the geometry of an
      # emitted figure. It is deliberately absent from `gates.yml`, which
      # needs neither `npm ci` nor a browser and answers in seconds; here the
      # five minutes are worth paying, because a tag is the last moment a
      # regression is cheaper to find than to explain. `browser.yml` is the
      # same run on demand, for proving a branch before it is tagged.
      #
      # Last of the checks, because it is the only one that costs minutes:
      # a stale tracked output should fail in two, not in seven.
      #
      # `findChrome()` takes $PSI_CHROME, then a Playwright cache, then a
      # browser the host installed - on a GitHub ubuntu runner that is
      # /usr/bin/google-chrome. Named in its own step so a missing browser
      # fails with the list of paths it tried rather than inside the suite.
      #
      # Exercised on a runner before this job was ever relied on: ubuntu-latest
      # answers /usr/bin/google-chrome and the suite passed from it, 577
      # assertions in 430 s. Placed after every check that can fail cheaply
      # and before anything is staged or published, so if a future runner
      # image moves the browser the worst case is a red release run with a
      # list of paths in the log - no archive, no release, no half-published
      # tag. The fix would be one path in chrome-path.mjs, which is the only
      # copy. `browser.yml` runs these same two steps on demand, which is the
      # cheaper place to discover it.
      - name: Name the browser
        run: node -e "import('./chrome-path.mjs').then(m => console.log(m.findChrome()))"

      - name: Browser suite
        run: node test/run.mjs

      - name: Stage the archive
        run: |
          mkdir -p dist/psi-slides
          git archive HEAD | tar -x -C dist/psi-slides
          for l in tutorial python-intro; do
            cp lectures/$l/audience.html lectures/$l/speaker.html \
               lectures/$l/print.html lectures/$l/print-notes.html \
               dist/psi-slides/lectures/$l/
          done
          cp docs/site/example/audience.html docs/site/example/speaker.html \
             docs/site/example/print.html docs/site/example/print-notes.html \
             dist/psi-slides/docs/site/example/

      - name: Pack
        run: |
          tar -czf psi-slides.tar.gz -C dist psi-slides
          (cd dist && zip -qr ../psi-slides.zip psi-slides)
          ls -lh psi-slides.tar.gz psi-slides.zip

      # Handed to `publish` rather than released from here, so that the
      # archives and the desktop packages go up together or not at all.
      - uses: actions/upload-artifact@v4
        with:
          name: psi-slides-engine
          if-no-files-found: error
          path: |
            psi-slides.tar.gz
            psi-slides.zip

  # The same jobs that test every push touching the app: unit tests, the
  # smoke test with its PDF parity check, then one unsigned package per
  # platform, uploaded as `psi-slides-builder-<os>` artefacts.
  desktop:
    name: Desktop builder
    needs: check
    uses: ./.github/workflows/desktop.yml

  publish:
    name: Publish the release
    needs: [check, engine, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-notes

      - uses: actions/download-artifact@v4
        with:
          name: psi-slides-engine
          path: assets

      - uses: actions/download-artifact@v4
        with:
          pattern: psi-slides-builder-*
          path: assets
          merge-multiple: true

      # No blockmaps: they belong to an updater the app does not have. And
      # the five desktop files are counted, so a platform whose package went
      # missing on the way fails here rather than shipping a release without
      # it.
      - name: List the assets
        run: |
          rm -f assets/*.blockmap
          ls -l assets
          for f in psi-slides.tar.gz psi-slides.zip \
                   psi-slides-builder-mac-arm64.dmg psi-slides-builder-mac-arm64.zip \
                   psi-slides-builder-win-x64.exe \
                   psi-slides-builder-linux-x86_64.AppImage psi-slides-builder-linux-amd64.deb; do
            [ -f "assets/$f" ] || { echo "missing asset: $f" >&2; exit 1; }
          done

      # gh is preinstalled on the runner, so the release step pulls in no
      # third-party action.
      # Nothing from the event reaches a shell here: the tag name arrives as
      # $GITHUB_REF_NAME and is quoted, and the one workflow value used in a
      # condition is passed through env rather than interpolated into the
      # script. `--repo` because this job checks nothing out.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          HAVE_NOTES: ${{ needs.check.outputs.have_notes }}
        run: |
          generate=""
          [ "$HAVE_NOTES" = "true" ] || generate="--generate-notes"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "psi-slides ${GITHUB_REF_NAME#v}" \
            --notes-file RELEASE_NOTES.md \
            $generate \
            assets/*
