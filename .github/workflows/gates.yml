# The checks that are cheap enough to run on every push.
#
# Until this existed, nothing ran on a branch: Pages fires on main and Release
# on a tag, so a figure-language regression was first seen by whoever merged
# it. Both of the programs run here are zero-dependency by design – `lint.js`
# so it can serve as a pre-commit gate without the Markdown and Shiki stack,
# `diagram-core.mjs` so the browser can run the same compiler the build runs –
# so this job needs no `npm ci` and finishes in seconds.
#
# What it deliberately does not do is build the lectures or run the browser
# suite. Those need the dependency tree and a Chromium, and they belong in the
# jobs that already pay for them: pages.yml and release.yml build, release.yml
# runs the browser suite before it cuts an archive, and browser.yml runs it on
# demand so a branch can be put through it without waiting for a tag. That
# last sentence was an intention for a while before it was true, and the cost
# was two lint.js gaps sitting behind passing assertions in the one entry
# point nothing ever ran.
name: Gates

on:
  push:
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first one's answer uninteresting.
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runners are pinned, not -latest: these jobs rely on measured image properties (Chrome at /usr/bin/google-chrome, no cwebp or magick, xvfb and poppler from apt), so moving one is a deliberate change that needs a browser.yml run first.
  gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # The same invocation pages.yml and release.yml use, so a branch cannot
      # go green here and red there.
      - name: Lint the lectures
        run: node lint.js lectures/ docs/site/example/source.md docs/artifact/figure-rules/source.md

      # The compiler gates: build-versus-linter agreement over the refusal
      # fixtures, the constructs the grammar must still accept, every corpus
      # figure, and the beat-locality of a `style` step's classes.
      - name: Fast gates
        run: node test/gates/run.mjs
