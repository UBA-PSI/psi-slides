# Publishes the site and its example lectures to GitHub Pages as live demos.
#
# The lectures are rebuilt from source rather than copied from tracked HTML
# outputs, so the demos can never be stale relative to source.md. That also
# makes this job a de-facto build check: a source or build.js change that
# breaks one of them fails here.
#
# Requires Settings -> Pages -> Source: "GitHub Actions" to be enabled once.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy midway; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Lint the lectures
        run: node lint.js lectures/ docs/artifact/figure-rules/source.md

      # Seconds, and they fail on things neither the linter nor the build can
      # see on its own: a linter that has drifted from the compiler it mirrors,
      # a construct the grammar has quietly stopped accepting, a `style` step
      # carrying a class the last beat bakes for every beat. Also run on every
      # push by gates.yml; repeated here so a deploy cannot go out over one.
      - name: Fast gates
        run: node test/gates/run.mjs

      # The promise `layout:` makes. It has to run where the deps are: it
      # builds a lecture through build.js, so it cannot be a fast gate.
      - name: Layout-generation compatibility
        run: node test/settings.mjs

      - name: Build the lectures
        run: |
          node build.js lectures/tutorial/source.md
          node build.js lectures/python-intro/source.md
          node build.js lectures/diagrams/source.md
          # A 39-line lecture, published so a reader can take in one whole
          # source at a glance. The screenshots come from python-intro.
          node build.js docs/site/example/source.md
          # Built although they are not published, because they are linted.
          # A line the build refuses and the linter passes merges green and
          # fails every later build. `lint.js` is deliberately the laxer of
          # the pair (it computes no geometry and cannot expand a tag), so
          # linting alone is not a gate on anything the compiler decides.
          node build.js lectures/network-security/source.md
          node build.js docs/artifact/figure-rules/source.md

      # Both pages this job publishes carry figures compiled from the lecture
      # above, and `refresh-figures.mjs` is the only text that compiles one for
      # publication. Nothing ran it here, so a commit that changed the compiler
      # or the lecture could publish a page whose drawings were made by an
      # older one - and the two files say in their own comments that this check
      # is what prevents that. It is a claim only if it runs.
      - name: Check the published figure pages are current
        run: node docs/artifact/refresh-figures.mjs --check

      - name: Assemble the site
        run: |
          mkdir -p _site/tutorial _site/python-intro _site/diagrams _site/example
          # Renders the docs from the same Markdown the repository serves, so
          # the site cannot drift from them.
          node docs/site/build-site.js _site
          for l in tutorial python-intro diagrams; do
            cp lectures/$l/audience.html \
               lectures/$l/speaker.html \
               lectures/$l/print.html \
               lectures/$l/print-notes.html \
               _site/$l/
          done
          cp docs/site/example/{audience,speaker,print,print-notes}.html _site/example/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
